[workspace.package]
authors = ["Andrea Sgobbi"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/dede1751/carp"
rust-version = "1.87"
edition = "2024"
keywords = ["chess"]
categories = ["games"]

[workspace]
resolver = "3"
members = [
    "crates/chess",
    "crates/engine",
    "crates/tools",
    "crates/wasm",
]

[profile.release]
opt-level = 3
debug = false
rpath = false
debug-assertions = false
codegen-units = 1
lto = true
panic = "abort"
