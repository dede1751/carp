[package]
name = "tools"
version = "1.0.0"
edition = "2021"
authors = ["Andrea Sgobbi"]
description = "Tools for Carp development"
license = "GPL-3.0"
readme = "readme.md"
keywords = ["chess"]
categories = ["games"]
repository = "https://github.com/dede1751/carp"

[dependencies]
chess = { path = "../chess" }
engine = { path = "../engine", features = ["datagen", "syzygy"] }

clap = { version = "4.2.1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
fastrand = "1.9.0"
ctrlc = "3.2.5"

bullet = { git = "https://github.com/jw1912/bullet", package = "bullet_lib", optional = true }
toml = { version = "0.9.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
train = ["dep:bullet", "dep:toml", "dep:serde"]
